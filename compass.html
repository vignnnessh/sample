<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Circle Example</title>
    <style>
      .circle {
        width: 100px; /* width */
        height: 100px; /* height (same as width) */
        background-color: skyblue; /* fill color */
        border-radius: 50%; /* makes it a circle */
      }
    </style>
  </head>
  <body>
    <div class="circle"></div>
  </body>
</html>
